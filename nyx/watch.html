<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nyx Player</title>
  <link rel="stylesheet" href="./nyx-player.css">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: rgba(255, 255, 255, 0.92);
      min-height: 100vh;
      padding: 40px 24px;
      position: relative;
    }

    .header {
      max-width: 1000px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .back-link:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.34);
    }

    .brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }

    .video-container {
      max-width: 1000px;
      margin: 0 auto 48px;
    }

    #player-container {
      margin-bottom: 20px;
    }

    .info-card {
      border-left: 1px solid rgba(255, 255, 255, 0.16);
      padding: 2px 0 2px 16px;
      color: rgba(255, 255, 255, 0.5);
    }

    .info-card h2 {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 8px;
    }

    .info-card p {
      font-size: 12px;
      line-height: 1.7;
      margin: 0;
      max-width: 60ch;
    }

    .footer {
      max-width: 1000px;
      margin: 0 auto;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.26);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 18px;
    }

    .error-screen {
      text-align: center;
      padding: 80px 24px;
    }

    .error-screen h2 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 14px;
      color: #fff;
    }

    .error-screen p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.46);
      margin-bottom: 28px;
    }

    .error-screen a {
      display: inline-block;
      padding: 11px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.72);
      text-decoration: none;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .error-screen a:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.34);
    }

    @media (max-width: 768px) {
      body {
        padding: 24px 16px;
      }

      .header {
        margin-bottom: 24px;
      }

      .video-container {
        margin-bottom: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="back-link">← Back</a>
    <div class="brand">Nyx</div>
  </div>

  <div class="video-container">
    <div id="player-container"></div>

    <div class="info-card">
      <h2>Focused viewing</h2>
      <p>This is a custom YouTube player that shows only the video and essential controls. No ads, no recommendations, no distractions.</p>
    </div>
  </div>

  <div class="footer">
    Built with Nyx Player • All videos served via YouTube API
  </div>

  <script type="module">
    import { NyxPlayer, extractVideoId } from './nyx-player.js';

    const params = new URLSearchParams(window.location.search);
    const videoIdParam = params.get('v');

    if (!videoIdParam) {
      showError('No video specified');
    } else {
      const videoId = extractVideoId(videoIdParam);

      if (!videoId) {
        showError('Invalid video ID');
      } else {
        try {
          const player = new NyxPlayer('#player-container', {
            videoId: videoId,
            volume: 80,
            autoplay: false
          });

          window.nyx = player;

        } catch (err) {
          console.error('Player error:', err);
          showError(err.message || 'Failed to load video');
        }
      }
    }

    function showError(message) {
      document.querySelector('.video-container').innerHTML = `
        <div class="error-screen">
          <h2>Unable to load video</h2>
          <p>${message}</p>
          <a href="index.html">Go back</a>
        </div>
      `;
    }
  </script>
</body>
</html>
