<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nyx — Custom YouTube Player</title>
  <link rel="stylesheet" href="./nyx-player.css">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: rgba(255, 255, 255, 0.92);
      min-height: 100vh;
      padding: 60px 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 56px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #fff;
    }

    .tagline {
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.34);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .preview {
      /* .nyx-stage owns the 16:9 box, corner radius and shadow, so this is
         only a positioning container. */
      min-width: 0;
    }

    .input-section h2 {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: rgba(255, 255, 255, 0.46);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #000;
      color: rgba(255, 255, 255, 0.92);
      font-size: 12.5px;
      font-family: inherit;
      letter-spacing: 0.01em;
      outline: none;
      transition: border-color 0.18s ease;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.34);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.34);
    }

    button {
      padding: 13px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #000;
      color: rgba(255, 255, 255, 0.72);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease;
      align-self: flex-start;
    }

    button:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.34);
    }

    button:active {
      background: rgba(255, 255, 255, 0.06);
    }

    .error {
      padding: 8px 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.72);
      font-size: 11.5px;
      display: none;
      margin-top: 12px;
    }

    .error.visible {
      display: block;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      h1 {
        font-size: 12px;
      }

      header {
        margin-bottom: 32px;
        flex-direction: column;
        gap: 8px;
      }

      body {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nyx</h1>
      <p class="tagline">A custom YouTube player. Clean. Focused. Yours.</p>
    </header>

    <div class="content">
      <div class="preview">
        <div id="preview-player"></div>
      </div>

      <div class="input-section">
        <h2>Watch a video</h2>
        <div class="input-group">
          <input
            type="text"
            id="url-input"
            placeholder="Paste YouTube URL..."
            autocomplete="off"
            spellcheck="false"
          >
          <button id="watch-btn">Watch</button>
        </div>
        <div id="error" class="error"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { NyxPlayer, extractVideoId } from './nyx-player.js';

    /* Visual preview of the player itself. No videoId, so it sits in its
       empty state. urlBar is forced off — the real input lives beside it and
       must not be duplicated inside the preview. */
    try {
      new NyxPlayer('#preview-player', { urlBar: false });
    } catch (err) {
      console.error('Preview failed:', err);
    }

    const input = document.getElementById('url-input');
    const button = document.getElementById('watch-btn');
    const error = document.getElementById('error');

    function showError(message) {
      error.textContent = message;
      error.classList.add('visible');
      setTimeout(() => error.classList.remove('visible'), 4000);
    }

    function handleSubmit() {
      const url = input.value.trim();

      if (!url) {
        showError('Please enter a YouTube URL');
        return;
      }

      const videoId = extractVideoId(url);

      if (!videoId) {
        showError('Invalid YouTube URL');
        return;
      }

      window.location.href = `watch.html?v=${videoId}`;
    }

    button.addEventListener('click', handleSubmit);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSubmit();
      }
    });

    input.focus();
  </script>
</body>
</html>
