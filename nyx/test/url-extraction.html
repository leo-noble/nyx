<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nyx — URL Extraction Tests</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #06070a;
      color: #e8e8ef;
      font: 13px/1.6 ui-monospace, "SF Mono", monospace;
    }
    h1 {
      font-size: 14px;
      font-weight: 550;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 0 0 20px;
      opacity: 0.6;
    }
    .pass { color: #6ee7a8; }
    .fail { color: #ff8b8b; font-weight: 700; }
    .test-group {
      margin-bottom: 24px;
    }
    .test-group h2 {
      font-size: 12px;
      letter-spacing: 0.08em;
      margin: 0 0 10px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <h1>URL Extraction Tests</h1>
  <div id="out"></div>

  <script type="module">
    import { extractVideoId } from './nyx-player.js';

    const out = document.getElementById('out');
    const results = [];

    function test(group, label, input, expected) {
      const actual = extractVideoId(input);
      const ok = actual === expected;
      results.push({ group, label, ok, actual, expected });

      const row = document.createElement('div');
      row.className = ok ? 'pass' : 'fail';
      row.textContent = `${ok ? 'PASS' : 'FAIL'}  ${label}`;
      if (!ok) {
        row.textContent += ` (got: ${actual}, expected: ${expected})`;
      }
      out.appendChild(row);
    }

    // Standard YouTube URLs
    const g1 = 'Standard URLs';
    test(g1, 'youtube.com/watch?v=', 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g1, 'youtube.com without www', 'https://youtube.com/watch?v=aqz-KE-bpKQ', 'aqz-KE-bpKQ');
    test(g1, 'youtu.be shortlink', 'https://youtu.be/jNQXAC9IVRw', 'jNQXAC9IVRw');
    test(g1, 'youtube.com/embed/', 'https://www.youtube.com/embed/M7lc1UVf-VE', 'M7lc1UVf-VE');
    test(g1, 'youtube.com/v/', 'https://www.youtube.com/v/9bZkp7q19f0', '9bZkp7q19f0');

    // With additional params
    const g2 = 'With Query Params';
    test(g2, 'watch?v= with &t=', 'https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=42s', 'dQw4w9WgXcQ');
    test(g2, 'watch?v= with &list=', 'https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=PLtest', 'dQw4w9WgXcQ');
    test(g2, 'youtu.be with ?t=', 'https://youtu.be/jNQXAC9IVRw?t=10', 'jNQXAC9IVRw');

    // YouTube Shorts
    const g3 = 'Shorts';
    test(g3, 'youtube.com/shorts/', 'https://www.youtube.com/shorts/abc123defgh', 'abc123defgh');
    test(g3, 'shorts with params', 'https://www.youtube.com/shorts/abc123defgh?feature=share', 'abc123defgh');

    const g1b = 'Host variants';
    test(g1b, 'm.youtube.com/watch', 'https://m.youtube.com/watch?v=dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g1b, 'music.youtube.com/watch', 'https://music.youtube.com/watch?v=dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g1b, 'youtube-nocookie embed', 'https://www.youtube-nocookie.com/embed/M7lc1UVf-VE', 'M7lc1UVf-VE');
    test(g1b, 'youtube.com/live/', 'https://www.youtube.com/live/dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g1b, 'no protocol', 'www.youtube.com/watch?v=dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g1b, 'www.youtu.be', 'https://www.youtu.be/jNQXAC9IVRw', 'jNQXAC9IVRw');

    // Bare video IDs
    const g4 = 'Bare IDs';
    test(g4, 'bare 11-char ID', 'dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g4, 'bare ID with dash', 'aqz-KE-bpKQ', 'aqz-KE-bpKQ');
    test(g4, 'bare ID with underscore', 'M7lc1UVf-VE', 'M7lc1UVf-VE');

    // Invalid inputs
    const g5 = 'Invalid';
    test(g5, 'empty string', '', null);
    test(g5, 'null', null, null);
    test(g5, 'non-YouTube URL', 'https://vimeo.com/123456', null);
    test(g5, 'malformed URL', 'not-a-url', null);
    test(g5, 'youtube.com without v param', 'https://www.youtube.com/watch', null);
    test(g5, 'wrong ID length', 'tooshort', null);

    // Edge cases
    const g6 = 'Edge Cases';
    test(g6, 'http instead of https', 'http://www.youtube.com/watch?v=dQw4w9WgXcQ', 'dQw4w9WgXcQ');
    test(g6, 'youtu.be with hash', 'https://youtu.be/jNQXAC9IVRw#t=10', 'jNQXAC9IVRw');
    test(g6, 'watch?v= as first param', 'https://www.youtube.com/watch?v=dQw4w9WgXcQ&feature=share', 'dQw4w9WgXcQ');

    // Summary by group
    const groups = [...new Set(results.map(r => r.group))];
    const summary = document.createElement('div');
    summary.style.marginTop = '32px';
    summary.style.paddingTop = '20px';
    summary.style.borderTop = '1px solid rgba(255,255,255,0.1)';

    groups.forEach(group => {
      const groupResults = results.filter(r => r.group === group);
      const passed = groupResults.filter(r => r.ok).length;
      const total = groupResults.length;
      const groupDiv = document.createElement('div');
      groupDiv.className = 'test-group';
      groupDiv.innerHTML = `<h2>${group}</h2><div class="${passed === total ? 'pass' : 'fail'}">${passed}/${total} passed</div>`;
      summary.appendChild(groupDiv);
    });

    const failed = results.filter(r => !r.ok);
    const total = results.length;
    const overallDiv = document.createElement('div');
    overallDiv.style.marginTop = '20px';
    overallDiv.style.fontSize = '16px';
    overallDiv.style.fontWeight = '600';
    overallDiv.className = failed.length === 0 ? 'pass' : 'fail';
    overallDiv.textContent = `Overall: ${total - failed.length}/${total} passed`;
    summary.appendChild(overallDiv);

    out.insertBefore(summary, out.firstChild);

    window.__NYX_URL_TESTS__ = { total, failed: failed.map(f => f.label) };
  </script>
</body>
</html>
