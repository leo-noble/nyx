<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nyx — state machine harness</title>
    <link rel="stylesheet" href="../nyx-player.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #06070a;
        color: #e8e8ef;
        font: 13px/1.6 ui-monospace, "SF Mono", monospace;
      }
      #player {
        width: 560px;
        margin-bottom: 24px;
      }
      .pass {
        color: #6ee7a8;
      }
      .fail {
        color: #ff8b8b;
        font-weight: 700;
      }
      h2 {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <h2>Assertions</h2>
    <div id="out"></div>

    <script>
      /* ------------------------------------------------------------------
         Mock YouTube IFrame API.

         The clock is manual: currentTime only moves when advance() is called.
         That is what makes it possible to assert the distinction the real
         implementation depends on — "state says PLAYING" versus "frames are
         actually being presented".
         ------------------------------------------------------------------ */
      const PlayerState = {
        UNSTARTED: -1,
        ENDED: 0,
        PLAYING: 1,
        PAUSED: 2,
        BUFFERING: 3,
        CUED: 5,
      };

      class MockPlayer {
        constructor(element, config) {
          this.cfg = config;
          this.events = config.events || {};
          this.t = 0;
          this.dur = 120;
          this.state = PlayerState.UNSTARTED;
          this.vol = 100;
          this.muted = false;
          this.rate = 1;
          this.loaded = 0.5;
          this.seeks = [];

          const iframe = document.createElement('iframe');
          iframe.src = 'about:blank';
          element.replaceWith(iframe);
          this.iframe = iframe;

          setTimeout(() => this.events.onReady?.({ target: this }), 0);
        }

        /* -- test controls -- */
        advance(seconds) {
          this.t += seconds;
        }
        emit(state) {
          this.state = state;
          this.events.onStateChange?.({ data: state, target: this });
        }

        /* -- YT surface -- */
        getCurrentTime() {
          return this.t;
        }
        getDuration() {
          return this.dur;
        }
        getPlayerState() {
          return this.state;
        }
        getVideoLoadedFraction() {
          return this.loaded;
        }
        getVolume() {
          return this.vol;
        }
        setVolume(v) {
          this.vol = v;
        }
        isMuted() {
          return this.muted;
        }
        mute() {
          this.muted = true;
        }
        unMute() {
          this.muted = false;
        }
        getPlaybackRate() {
          return this.rate;
        }
        setPlaybackRate(r) {
          this.rate = r;
          this.events.onPlaybackRateChange?.({ data: r, target: this });
        }
        playVideo() {
          this.emit(PlayerState.PLAYING);
        }
        pauseVideo() {
          this.emit(PlayerState.PAUSED);
        }
        seekTo(t, precise) {
          this.seeks.push({ t, precise });
          this.t = t;
        }
        getIframe() {
          return this.iframe;
        }
        destroy() {
          this.iframe.remove();
        }
      }

      window.YT = { Player: MockPlayer, PlayerState };
    </script>

    <script type="module">
      import { NyxPlayer } from '../nyx-player.js';

      const out = document.getElementById('out');
      const results = [];

      function check(label, condition) {
        results.push({ label, ok: !!condition });
        const row = document.createElement('div');
        row.className = condition ? 'pass' : 'fail';
        row.textContent = `${condition ? 'PASS' : 'FAIL'}  ${label}`;
        out.appendChild(row);
      }

      const frames = (n = 2) =>
        new Promise((resolve) => {
          let i = 0;
          const step = () => (++i >= n ? resolve() : requestAnimationFrame(step));
          requestAnimationFrame(step);
        });

      const masked = () => player.root.classList.contains('is-masked');

      const player = new NyxPlayer('#player', {
        videoId: 'MOCK',
        volume: 80,
        loop: true,
      });

      await new Promise((r) => setTimeout(r, 20)); // let onReady land
      const yt = player.yt;

      /* ---------------------------------------------------------------- */
      check('curtain is opaque on initialisation', masked());
      check('duration read on ready (02:00)', player.el.dur.textContent === '02:00');
      check('volume applied on ready', yt.getVolume() === 80);

      /* PLAYING alone must NOT lift the curtain -------------------------- */
      yt.emit(YT.PlayerState.PLAYING);
      await frames(4);
      check('PLAYING with a stalled playhead keeps the curtain up', masked());
      check('spinner shown while waiting for frames', player.root.classList.contains('is-busy'));

      /* Advancing the playhead is what lifts it -------------------------- */
      yt.advance(0.2);
      await frames(4);
      check('curtain lifts once the playhead actually advances', !masked());
      check('spinner cleared after reveal', !player.root.classList.contains('is-busy'));
      check('is-playing class set', player.root.classList.contains('is-playing'));

      /* Small seek: no re-mask ------------------------------------------- */
      player.seekTo(player.yt.getCurrentTime() + 0.5, true);
      await frames(2);
      check('a sub-threshold seek does not re-mask', !masked());

      /* Large seek while playing: re-mask, then recover ------------------ */
      player.seekTo(60, true);
      check('a large seek re-raises the curtain', masked());
      await frames(3);
      check('curtain stays up until frames resume', masked());
      yt.advance(0.2);
      await frames(4);
      check('curtain lifts again after the seek settles', !masked());

      /* Loop restart ------------------------------------------------------ */
      yt.seeks.length = 0;
      yt.emit(YT.PlayerState.ENDED);
      check('loop re-masks across the restart', masked());
      const restart = yt.seeks.find((s) => s.t === 0 && s.precise);
      check('loop seeks precisely back to 0', !!restart);
      // playVideo() inside the ENDED branch already emitted PLAYING, so a
      // confirmation pass is live with a baseline of 0 — just advance.
      yt.advance(0.2);
      await frames(4);
      check('curtain lifts after the loop restart', !masked());

      /* Repeated PLAYING must not move the baseline ----------------------- */
      yt.emit(YT.PlayerState.PLAYING);
      player.seekTo(20, true);
      check('curtain up before the re-baseline probe', masked());
      yt.emit(YT.PlayerState.PLAYING); // YouTube re-fires this after a stall
      yt.emit(YT.PlayerState.PLAYING);
      yt.advance(0.2);
      await frames(4);
      check('repeated PLAYING events do not re-baseline the curtain', !masked());

      /* Pause must never strand the curtain ------------------------------ */
      player.seekTo(90, true);
      check('curtain up after a large seek', masked());
      yt.emit(YT.PlayerState.PAUSED);
      await frames(2);
      check('pausing behind the curtain releases it', !masked());

      /* Mid-playback buffering must not flicker the curtain --------------- */
      yt.emit(YT.PlayerState.PLAYING);
      yt.advance(0.2);
      await frames(4);
      check('playing again after pause', !masked());
      yt.emit(YT.PlayerState.BUFFERING);
      await frames(2);
      check('a mid-playback stall does not raise the curtain', !masked());

      /* Keyboard --------------------------------------------------------- */
      const key = (k) =>
        player.root.dispatchEvent(
          new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true })
        );

      yt.emit(YT.PlayerState.PLAYING);
      key(' ');
      check('Space pauses', yt.getPlayerState() === YT.PlayerState.PAUSED);
      key('k');
      check('K resumes', yt.getPlayerState() === YT.PlayerState.PLAYING);

      yt.t = 50;
      key('ArrowRight');
      check('ArrowRight seeks +5s', Math.abs(yt.getCurrentTime() - 55) < 0.01);
      key('ArrowLeft');
      check('ArrowLeft seeks -5s', Math.abs(yt.getCurrentTime() - 50) < 0.01);

      yt.setVolume(50);
      yt.muted = false;
      key('ArrowUp');
      check('ArrowUp raises volume', yt.getVolume() === 55);
      key('ArrowDown');
      check('ArrowDown lowers volume', yt.getVolume() === 50);

      key('m');
      check('M mutes', yt.isMuted());
      check('mute glyph reflects state', player.root.querySelector('.nyx-vol-ico').dataset.level === 'mute');
      key('m');
      check('M unmutes', !yt.isMuted());

      const spaceEvent = new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true });
      player.root.dispatchEvent(spaceEvent);
      check('Space is preventDefault-ed (no page scroll)', spaceEvent.defaultPrevented);

      /* Playback rate ------------------------------------------------------ */
      player.root.querySelector('.nyx-rate-item[data-rate="1.5"]').click();
      check('rate selector sets 1.5x', yt.getPlaybackRate() === 1.5);
      check('rate button label updates', player.el.rateBtn.textContent === '1.5x');
      check(
        'rate menu marks the active item',
        player.root.querySelector('.nyx-rate-item[data-rate="1.5"]').getAttribute('aria-checked') === 'true'
      );

      /* Auto-hide ---------------------------------------------------------- */
      document.activeElement?.blur?.();
      yt.emit(YT.PlayerState.PLAYING);
      player._hideUI();
      check('controls hide during playback', player.root.classList.contains('is-ui-hidden'));
      player._revealUI();
      check('controls return on activity', !player.root.classList.contains('is-ui-hidden'));

      // A button focused by pointer keeps DOM focus; that must not pin the dock.
      player.el.fs.focus();
      player._hideUI();
      check(
        'a pointer-focused button does not pin the dock open',
        player.root.classList.contains('is-ui-hidden')
      );
      player._revealUI();
      document.activeElement?.blur?.();

      yt.emit(YT.PlayerState.PAUSED);
      player._hideUI();
      check('controls never hide while paused', !player.root.classList.contains('is-ui-hidden'));

      /* Progress rendering -------------------------------------------------- */
      yt.t = 30;
      player._render();
      check('elapsed renders as MM:SS', player.el.cur.textContent === '00:30');
      check('progress fill tracks position (25%)', player.el.fill.style.width === '25%');
      check('buffered indicator tracks loaded fraction (50%)', player.el.buffer.style.width === '50%');

      /* Teardown ------------------------------------------------------------ */
      const before = document.querySelectorAll('.nyx').length;
      player.destroy();
      check('destroy() removes the player', document.querySelectorAll('.nyx').length === before - 1);

      const failed = results.filter((r) => !r.ok);
      const summary = document.createElement('h2');
      summary.textContent = `${results.length - failed.length}/${results.length} passed`;
      summary.style.color = failed.length ? '#ff8b8b' : '#6ee7a8';
      out.prepend(summary);

      window.__NYX_RESULTS__ = { total: results.length, failed: failed.map((f) => f.label) };
    </script>
  </body>
</html>
